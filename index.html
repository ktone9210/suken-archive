 btn('ページ画像を作成',async()=>{if(rows.length)throw new Error('ページ画像は既に作成済みです。');busy=true;const paths=[];let committed=false;try{status.textContent='元ファイルを取得中…';const blob=check(await bucket.download(f.storage_path));let pdf=null,img=null;if(f.mime_type==='application/pdf'||/\.pdf$/i.test(f.file_name)){const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise}else{img=await createImageBitmap(blob)}const count=pdf?pdf.numPages:1;const records=[];for(let n=1;n<=count;n++){status.textContent=`画像作成中 ${n}/${count}`;const c=document.createElement('canvas');if(pdf){const p=await pdf.getPage(n),v=p.getViewport({scale:1}),vp=p.getViewport({scale:Math.min(3,3000/Math.max(v.width,v.height))});c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;p.cleanup()}else{c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0)}const b=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!b)throw new Error('画像化に失敗しました');const path=`pages/${f.id}/${crypto.randomUUID()}.png`;check(await bucket.upload(path,b,{contentType:'image/png'}));paths.push(path);records.push({exam_file_id:f.id,storage_path:path,source_page:n,sort_order:n-1});}check(await db.from('pages').insert(records));committed=true;await load();}catch(e){if(!committed&&paths.length){const cleanup=await bucket.remove(paths);if(cleanup.error)throw new Error((e.message||e)+' / 画像の後処理に失敗しました')}throw e}finally{busy=false}});
 await load();
}

for(const t of tabs){const b=el('button',t);b.onclick=()=>show(t);$('nav').append(b)}
async function session(s){if(s&&s.user.id!==owner){await db.auth.signOut();$('message').textContent='このアカウントは利用できません。';return}if(current===s?.user.id&&s)return;current=s?.user.id??null;$('login').hidden=!!s;$('app').hidden=!s;$('logout').hidden=!s;if(s){$('password').value='';$('message').textContent='';show('ホーム')}else{seq++;$('content').replaceChildren()}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await session(data.session)}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)fail(error);else await session(null)};db.auth.onAuthStateChange((event,s)=>{setTimeout(()=>session(s),0)});const {data,error}=await db.auth.getSession();if(error)$('message').textContent=error.message;else await session(data.session);
</script></body></html>
