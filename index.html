function menuIcon(name){const paths={'過去問閲覧':'M12 7v14 M3 4h4a5 5 0 0 1 5 3 5 5 0 0 1 5-3h4v14h-4a5 5 0 0 0-5 3 5 5 0 0 0-5-3H3Z','問題検索':'M21 21l-5-5 M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z','復習記録':'M12 21H5V3h13v8 M3 7h4 M3 12h4 M3 17h4 M14 17l6-6 3 3-6 6-4 1Z','過去問データ管理':'M3 6a9 3 0 1 0 18 0 9 3 0 1 0-18 0 M3 6v12a9 3 0 0 0 18 0V6 M3 12a9 3 0 0 0 18 0','分類タグ管理':'M3 3h8l10 10-8 8L3 11Z M7 7h.01','arrow':'m9 6 6 6-6 6'};const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),path=document.createElementNS(ns,'path');for(const [k,v] of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'1.7','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true',class:name==='arrow'?'menu-arrow':'menu-icon'}))svg.setAttribute(k,v);path.setAttribute('d',paths[name]);svg.append(path);return svg;}
function homeMenu(c){for(const [heading,items] of [['学習 / STUDY',[['過去問閲覧','検定回から問題を選択'],['問題検索','分類タグから問題を検索'],['復習記録','学習履歴・解法・答案画像']]],['データ管理 / MANAGEMENT',[['過去問データ管理','検定回・ファイル・ページ・問題の登録と編集'],['分類タグ管理','分類の追加・変更・削除']]]]){c.append(el('h3',heading,'sectionlabel'));const group=el('div','','menugroup');for(const [name,desc] of items){const b=el('button','','menulink');const label=el('div','','menu-label');label.append(el('strong',name),el('span',desc,'muted'));b.append(menuIcon(name),label);b.append(menuIcon('arrow'));b.onclick=()=>show(name);group.append(b)}c.append(group)}}
async function browseExams(c,token){const es=await allRows('exams');if(token!==seq)return;const order=qfield(c,'検定回の順序','select');qoption(order,'desc','新しい回から');qoption(order,'asc','古い回から');const list=el('div','');c.append(list);const opened=new Map();let generation=0;async function draw(){const g=++generation;const [qs,rs]=await Promise.all([allRows('questions'),allRows('reviews')]);if(token!==seq||g!==generation)return;const by=new Map();for(const r of rs){if(!by.has(r.question_id))by.set(r.question_id,[]);by.get(r.question_id).push(r)}for(const h of by.values())h.sort((a,b)=>b.review_date.localeCompare(a.review_date)||b.created_at.localeCompare(a.created_at)||b.id.localeCompare(a.id));list.replaceChildren();for(const e of [...es].sort((a,b)=>(order.value==='asc'?1:-1)*(a.exam_number-b.exam_number))){const row=el('div','','examrow');row.append(el('h3',`第${e.exam_number}回　${e.exam_date}`));const p=el('div','');function stageList(stage){opened.set(e.id,stage);p.replaceChildren(el('h4',stage===1?'一次試験':'二次試験'));const rows=qs.filter(q=>q.exam_id===e.id&&q.stage===stage).sort((a,b)=>a.question_number-b.question_number);if(!rows.length)p.append(el('p','問題は未登録です。','muted'));else qbutton(p,'先頭の問題から解く',()=>openReader(rows[0],rows,[e],draw));for(const q of rows){const b=qbutton(p,`問題${q.question_number} ${q.title??''}`,()=>openReader(q,rows,[e],draw));b.className='questionlink';b.dataset.questionId=q.id;const h=by.get(q.id)||[],r=h[0];b.append(el('span',r?`${reviewLabels[r.result]||r.result} ／ ${r.review_date} ／ ${h.length}回`:'未解答','reviewresult '+(r?.result||'')));}}for(const stage of [1,2]){if(stage===1&&e.first_stage_exempt)continue;qbutton(row,stage===1?'一次試験':'二次試験',()=>stageList(stage))}row.append(p);list.append(row);if(opened.has(e.id))stageList(opened.get(e.id))}if(!es.length)list.append(el('p','検定回は未登録です。'))}order.onchange=()=>draw().catch(fail);await draw()}

function readerImage(cv,fit=true){const box=el('div','','readerimage');if(fit){cv.style.width='100%';cv.style.maxWidth='100%';cv.style.margin='0'}box.append(cv);if(fit){let z=1;const bar=el('div','','imagebar');function resize(){cv.style.maxWidth='none';cv.style.width=(z*100)+'%'}qbutton(bar,'−',()=>{z=Math.max(1,z/1.25);resize()});qbutton(bar,'＋',()=>{z=Math.min(5,z*1.25);resize()});qbutton(bar,'幅に合わせる',()=>{z=1;resize()});box.before(bar);const wrap=el('div','','imagewrap');wrap.append(box,bar);cv.onclick=()=>fullImage(cv);qbutton(bar,'全画面',()=>fullImage(cv));return wrap}return box}
function fullImage(cv){const d=qdialog('画像拡大');d.classList.add('imagefull');qbutton(d,'閉じる',()=>d.close());const box=el('div','','readerimage');const copy=document.createElement('canvas');copy.width=cv.width;copy.height=cv.height;copy.getContext('2d').drawImage(cv,0,0);let z=1;const bar=el('div','','imagebar');function resize(){copy.style.width=(z*100)+'%';copy.style.maxWidth='none';copy.style.height='auto'}qbutton(bar,'−',()=>{z=Math.max(1,z/1.25);resize()});qbutton(bar,'＋',()=>{z=Math.min(6,z*1.25);resize()});box.append(copy);d.append(bar,box);resize();d.showModal()}
async function openReader(q,rows,es,onReturn){const origin=$('content').firstChild;const d=qdialog('問題閲覧');d.classList.add('reader');if(onReturn)d.addEventListener('close',async()=>{if(!$('content').contains(origin))return;try{await onReturn();if($('content').contains(origin))document.querySelector('[data-question-id="'+rows[i].id+'"]')?.scrollIntoView({block:'nearest'})}catch(e){fail(e)}},{once:true});d.showModal();let i=rows.findIndex(x=>x.id===q.id),generation=0;async function draw(){const g=++generation;const x=rows[i],e=es.find(v=>v.id===x.exam_id);d.replaceChildren();const top=el('div','','readertop');qbutton(top,'一覧に戻る',()=>d.close());top.append(el('h3',`第${e?.exam_number??''}回・${x.stage}次・問題${x.question_number}`));d.append(top);if(x.title)d.append(el('p',x.title));const body=el('div','','readerbody');d.append(body);try{await viewQuestion(body,x)}catch(err){body.append(el('p',err.message||String(err),'error'))}if(g!==generation||!d.open)return;const nav=el('div','','actions readernav');const prev=qbutton(nav,'‹ 前の問題',async()=>{if(i>0){i--;await draw();d.scrollTop=0}});prev.disabled=i===0;nav.append(el('span',`${i+1} / ${rows.length}`));const next=qbutton(nav,'次の問題 ›',async()=>{if(i<rows.length-1){i++;await draw();d.scrollTop=0}});next.disabled=i===rows.length-1;d.append(nav);const history=el('div','','reviewpanel');d.append(history);await reviewPanel(history,x)}await draw()}


const reviewLabels={correct:'正解',partial:'部分正解',incorrect:'不正解',unrated:'未評価'};
const reviewBucket=db.storage.from('suken-files');
const reviewToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
async function reviewRows(q){return qcheck(await db.from('reviews').select('*').eq('question_id',q.id).order('review_date',{ascending:false}).order('created_at',{ascending:false}));}
async function reviewPhotos(r){return qcheck(await db.from('review_images').select('*').eq('review_id',r.id).order('sort_order').order('created_at'));}
async function removeReviewPhoto(p){qcheck(await reviewBucket.remove([p.storage_path]));qcheck(await db.from('review_images').delete().eq('id',p.id));}
async function removeReview(r){for(const p of await reviewPhotos(r))await removeReviewPhoto(p);qcheck(await db.from('reviews').delete().eq('id',r.id));}
async function showReviewPhoto(p){const url=qcheck(await reviewBucket.createSignedUrl(p.storage_path,300)).signedUrl;const d=qdialog('答案画像');d.classList.add('imagefull');qbutton(d,'閉じる',()=>d.close());const box=el('div','','readerimage'),img=document.createElement('img');img.src=url;img.alt=p.file_name||'答案画像';let z=1;const resize=()=>{img.style.width=z*100+'%';img.style.maxWidth='none'};const a=el('div','','imagebar');qbutton(a,'−',()=>{z=Math.max(1,z/1.25);resize()});qbutton(a,'＋',()=>{z=Math.min(6,z*1.25);resize()});box.append(img);d.append(a,box);resize();d.showModal();}
async function reviewForm(q,r,refresh){const d=qdialog(r?'復習記録を編集':'復習記録を追加');d.classList.add('reviewform');const date=qfield(d,'解答日','date',r?.review_date||reviewToday()),result=qfield(d,'正誤','select');qoption(result,'','選択してください');for(const k of ['correct','partial','incorrect'])qoption(result,k,reviewLabels[k]);result.value=r?.result||'';const memo=qfield(d,'解法・着眼点','textarea',r?.memo||'');memo.placeholder='解法、別解、反省点、注意点など';const photos=el('div','');d.append(photos);let existing=r?await reviewPhotos(r):[];const removed=new Set();function drawPhotos(){photos.replaceChildren();for(const p of existing.filter(x=>!removed.has(x.id))){const a=el('div','','actions');a.append(el('span',p.file_name||'答案画像'));qbutton(a,'閲覧',()=>showReviewPhoto(p));qbutton(a,'削除予定',()=>{removed.add(p.id);drawPhotos()});photos.append(a)}if(removed.size)qbutton(photos,'画像削除を取り消す',()=>{removed.clear();drawPhotos()})}drawPhotos();const files=qfield(d,'答案画像を追加（複数選択可）','file');files.multiple=true;files.accept='image/jpeg,image/png,image/webp';const msg=el('p','','error');d.append(msg);const a=el('div','','actions');d.append(a);let busy=false,saved=r;const cancel=qbutton(a,'閉じる',()=>d.close());d.addEventListener('cancel',e=>{if(busy)e.preventDefault()});qbutton(a,'保存',async()=>{if(busy)return;if(!date.value||!['correct','partial','incorrect'].includes(result.value))throw Error('解答日と正誤を入力してください。');const pending=[...files.files];for(const f of pending){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>50*1024*1024)throw Error('JPEG・PNG・WebP（各50MB以下）を選択してください。')}busy=true;cancel.disabled=true;msg.textContent='保存中…';try{const values={question_id:q.id,review_date:date.value,result:result.value,memo:memo.value.trim()||null};if(saved)qcheck(await db.from('reviews').update(values).eq('id',saved.id));else saved=qcheck(await db.from('reviews').insert(values).select().single());for(const p of existing.filter(x=>removed.has(x.id))){await removeReviewPhoto(p);removed.delete(p.id)}existing=await reviewPhotos(saved);let order=Math.max(-1,...existing.map(x=>x.sort_order))+1;const completed=new Set();try{for(const f of pending){const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type],path=`reviews/${saved.id}/${crypto.randomUUID()}.${ext}`;qcheck(await reviewBucket.upload(path,f,{contentType:f.type}));try{qcheck(await db.from('review_images').insert({review_id:saved.id,storage_path:path,file_name:f.name,sort_order:order++}));completed.add(f)}catch(e){await reviewBucket.remove([path]);throw e}}}finally{const dt=new DataTransfer();for(const f of pending)if(!completed.has(f))dt.items.add(f);files.files=dt.files}d.close();await refresh()}catch(e){msg.textContent='保存処理が途中で停止しました。再試行できます。 '+(e.message||e);if(saved){existing=await reviewPhotos(saved);drawPhotos();await refresh()}}finally{busy=false;cancel.disabled=false}});d.showModal();}
async function reviewCard(parent,r,q,refresh,heading){const card=el('div','','reviewcard');parent.append(card);if(heading)card.append(el('strong',heading));card.append(el('p',r.review_date+'　'+(reviewLabels[r.result]||r.result),'reviewresult '+r.result));if(r.memo)card.append(el('p',r.memo,'reviewmemo'));const photos=await reviewPhotos(r);if(photos.length){const a=el('div','','actions');card.append(a);for(const p of photos)qbutton(a,'答案画像 '+(photos.indexOf(p)+1),()=>showReviewPhoto(p))}const a=el('div','','actions');card.append(a);qbutton(a,'編集',()=>reviewForm(q,r,refresh));qbutton(a,'削除',async()=>{if(confirm('この復習記録と答案画像を削除しますか？')){await removeReview(r);await refresh()}});return card;}
async function reviewPanel(panel,q){panel.replaceChildren(el('h3','復習記録'));try{const rs=await reviewRows(q);panel.append(el('p',rs.length?`解答回数：${rs.length}回　最新：${rs[0].review_date} ${reviewLabels[rs[0].result]||rs[0].result}`:'まだ記録がありません。','muted'));qbutton(panel,'復習記録を追加',()=>reviewForm(q,null,()=>reviewPanel(panel,q)));if(rs.length){const details=el('details','');details.append(el('summary','復習履歴を表示'));panel.append(details);for(const r of rs)await reviewCard(details,r,q,()=>reviewPanel(panel,q))}}catch(e){panel.append(el('p',e.message||String(e),'error'))}}
async function reviewHome(c,token){const [rs,qs,es]=await Promise.all([allRows('reviews'),allRows('questions'),allRows('exams')]);if(token!==seq)return;c.replaceChildren(el('h2','復習記録'));rs.sort((a,b)=>b.review_date.localeCompare(a.review_date)||b.created_at.localeCompare(a.created_at));c.append(el('p',`${rs.length}件の記録`,'muted'));for(const r of rs){if(token!==seq)return;const q=qs.find(x=>x.id===r.question_id);if(!q)continue;const e=es.find(x=>x.id===q.exam_id);const card=await reviewCard(c,r,q,()=>reviewHome(c,token),`第${e?.exam_number??''}回・${q.stage}次・問題${q.question_number}`);qbutton(card,'問題を閲覧',()=>openReader(q,[q],es))}}

async function session(s){if(s&&s.user.id!==owner){await db.auth.signOut();$('message').textContent='このアカウントは利用できません。';return}if(current===s?.user.id&&s)return;current=s?.user.id??null;$('login').hidden=!!s;$('app').hidden=!s;$('logout').hidden=!s;if(s){$('password').value='';$('message').textContent='';show('ホーム')}else{seq++;$('content').replaceChildren()}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await session(data.session)}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)fail(error);else await session(null)};db.auth.onAuthStateChange((event,s)=>{setTimeout(()=>session(s),0)});const {data,error}=await db.auth.getSession();if(error)$('message').textContent=error.message;else await session(data.session);
