tring(e),'error'))}});qbutton(a,'編集',()=>{const d=qdialog('問題情報の編集'),n=qfield(d,'問題番号','number',q.question_number),t=qfield(d,'タイトル','text',q.title),m=qfield(d,'メモ','textarea',q.memo),s=qfield(d,'必答区分','select');for(const [v,l] of [['','未設定'],['true','必答'],['false','選択']])qoption(s,v,l);s.value=q.is_required===null?'':String(q.is_required);s.parentElement.hidden=q.stage===1;qbutton(d,'保存',async()=>{const v=Number(n.value);if(!Number.isInteger(v)||v<1||v>2147483647)throw new Error('正の整数を入力してください。');qcheck(await db.from('questions').update({question_number:v,title:t.value.trim()||null,memo:m.value.trim()||null,is_required:q.stage===2&&s.value?s.value==='true':null}).eq('id',q.id));d.close();await questionPanel(panel,exam,only)});qbutton(d,'キャンセル',()=>d.close());d.showModal()});qbutton(a,'削除',async()=>{if(confirm('問題と関連する範囲・復習記録などを削除しますか？')){qcheck(await db.from('questions').delete().eq('id',q.id));await questionPanel(panel,exam,only)}})}}

async function allRows(table,columns='*'){let out=[];for(let i=0;;i+=500){const a=qcheck(await db.from(table).select(columns).order(table==='question_tags'?'question_id':'id').order(table==='question_tags'?'tag_id':'id').range(i,i+499));out.push(...a);if(a.length<500)return out}}
const tagSort=(a,b)=>a.sort_order-b.sort_order||a.name.localeCompare(b.name,'ja');
function tagPath(t,ts){return (ts.find(x=>x.id===t.parent_id)?.name?ts.find(x=>x.id===t.parent_id).name+' / ':'')+t.name}
function tagPicker(box,ts,selected){const filter=qfield(box,'タグ名で絞り込み','text',''),list=el('div','','taglist');box.append(list);function draw(){list.replaceChildren();for(const t of ts.filter(x=>!x.parent_id).sort(tagSort).flatMap(x=>[x,...ts.filter(y=>y.parent_id===x.id).sort(tagSort)])){if(!tagPath(t,ts).includes(filter.value.trim()))continue;const l=el('label',tagPath(t,ts)),n=document.createElement('input');n.type='checkbox';n.checked=selected.has(t.id);n.onchange=()=>n.checked?selected.add(t.id):selected.delete(t.id);l.prepend(n);list.append(l)}}filter.oninput=draw;draw()}
async function tagEdit(q,refresh){const d=qdialog('分類タグの編集');let ts=await allRows('tags'),old=new Set(qcheck(await db.from('question_tags').select('tag_id').eq('question_id',q.id)).map(x=>x.tag_id)),selected=new Set(old);const box=el('div','');d.append(box);tagPicker(box,ts,selected);qbutton(d,'新しいタグを作成',async()=>{await tagForm(null,ts,async()=>{ts=await allRows('tags');box.replaceChildren();tagPicker(box,ts,selected)})});qbutton(d,'保存',async()=>{const add=[...selected].filter(x=>!old.has(x)),del=[...old].filter(x=>!selected.has(x));if(add.length)qcheck(await db.from('question_tags').upsert(add.map(tag_id=>({question_id:q.id,tag_id})),{onConflict:'question_id,tag_id',ignoreDuplicates:true}));if(del.length)qcheck(await db.from('question_tags').delete().eq('question_id',q.id).in('tag_id',del));d.close();await refresh()});qbutton(d,'キャンセル',()=>d.close());d.showModal()}
async function tagForm(t,ts,refresh){const d=qdialog(t?'タグ名の編集':'タグの追加'),n=qfield(d,'タグ名','text',t?.name??''),p=qfield(d,'親分類','select');qoption(p,'','大分類（親なし）');for(const x of ts.filter(x=>!x.parent_id).sort(tagSort))qoption(p,x.id,x.name);p.value=t?.parent_id??'';p.disabled=!!t; qbutton(d,'保存',async()=>{const name=n.value.trim();if(!name)throw Error('タグ名を入力してください。');if(t)qcheck(await db.from('tags').update({name}).eq('id',t.id));else qcheck(await db.from('tags').insert({name,parent_id:p.value||null,sort_order:Math.max(0,...ts.filter(x=>x.parent_id===(p.value||null)).map(x=>x.sort_order))+1}));d.close();await refresh()});qbutton(d,'キャンセル',()=>d.close());d.showModal()}
async function tagManage(c){const ts=await allRows('tags'),links=await allRows('question_tags');c.replaceChildren(el('h2','タグ管理'));qbutton(c,'タグを追加',()=>tagForm(null,ts,()=>tagManage(c)));for(const root of ts.filter(t=>!t.parent_id).sort(tagSort)){for(const t of [root,...ts.filter(x=>x.parent_id===root.id).sort(tagSort)]){const row=el('div','','examrow');if(t.parent_id)row.style.marginLeft='24px';const ids=new Set([t.id,...ts.filter(x=>x.parent_id===t.id).map(x=>x.id)]);row.append(el('strong',`${t.name}（${new Set(links.filter(x=>ids.has(x.tag_id)).map(x=>x.question_id)).size}問）`));const a=el('div','','actions');row.append(a);qbutton(a,'名称変更',()=>tagForm(t,ts,()=>tagManage(c)));for(const delta of [-1,1])qbutton(a,delta<0?'↑':'↓',async()=>{const siblings=ts.filter(x=>x.parent_id===t.parent_id).sort(tagSort),i=siblings.indexOf(t),j=i+delta;if(j<0||j>=siblings.length)return;[siblings[i],siblings[j]]=[siblings[j],siblings[i]];for(const [k,x] of siblings.entries())qcheck(await db.from('tags').update({sort_order:k}).eq('id',x.id));await tagManage(c)});qbutton(a,'削除',async()=>{if(ts.some(x=>x.parent_id===t.id))throw Error('先に小分類を削除してください。');if(confirm('タグと問題への関連付けを削除しますか？')){qcheck(await db.from('tags').delete().eq('id',t.id));await tagManage(c)}});c.append(row)}}}
async function tagSearch(c){const [ts,links,qs,es]=await Promise.all([allRows('tags'),allRows('question_tags'),allRows('questions'),allRows('exams')]);const selected=new Set(),stage=qfield(c,'試験区分','select');for(const [v,l] of [['','すべて'],['1','一次'],['2','二次']])qoption(stage,v,l);const lo=qfield(c,'検定回（開始）','number',''),hi=qfield(c,'検定回（終了）','number','');tagPicker(c,ts,selected);const mode=qfield(c,'タグ検索条件','select');qoption(mode,'and','すべて（AND）');qoption(mode,'or','いずれか（OR）');const un=qfield(c,'未分類のみ（チェック）','checkbox');const result=el('div','');qbutton(c,'検索',draw);c.append(result);function draw(){result.replaceChildren();const rows=qs.filter(q=>{const e=es.find(x=>x.id===q.exam_id),ids=new Set(links.filter(x=>x.question_id===q.id).map(x=>x.tag_id));if(!e||stage.value&&q.stage!==Number(stage.value)||lo.value&&e.exam_number<Number(lo.value)||hi.value&&e.exam_number>Number(hi.value)||un.checked&&ids.size)return false;const matches=[...selected].map(id=>ids.has(id)||ts.some(t=>t.parent_id===id&&ids.has(t.id)));return !matches.length||(mode.value==='and'?matches.every(Boolean):matches.some(Boolean))}).sort((a,b)=>es.find(x=>x.id===b.exam_id).exam_number-es.find(x=>x.id===a.exam_id).exam_number||a.stage-b.stage||a.question_number-b.question_number);result.append(el('h3',`${rows.length}問`));for(const q of rows){const e=es.find(x=>x.id===q.exam_id),r=el('div','','examrow');r.append(el('strong',`第${e.exam_number}回・${q.stage}次・問題${q.question_number} ${q.title??''}`),el('p',ts.filter(t=>links.some(x=>x.question_id===q.id&&x.tag_id===t.id)).map(t=>tagPath(t,ts)).join('、')||'未分類','muted'));qbutton(r,'閲覧・編集',async()=>{const d=qdialog(`第${e.exam_number}回`),p=el('div','');d.append(p);qbutton(d,'閉じる',()=>{d.close();show('タグ別')});d.showModal();await questionPanel(p,e,q.id)});result.append(r)}}draw()}

for(const t of tabs){const b=el('button',t);b.onclick=()=>show(t);$('nav').append(b)}
async function session(s){if(s&&s.user.id!==owner){await db.auth.signOut();$('message').textContent='このアカウントは利用できません。';return}if(current===s?.user.id&&s)return;current=s?.user.id??null;$('login').hidden=!!s;$('app').hidden=!s;$('logout').hidden=!s;if(s){$('password').value='';$('message').textContent='';show('ホーム')}else{seq++;$('content').replaceChildren()}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await session(data.session)}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)fail(error);else await session(null)};db.auth.onAuthStateChange((event,s)=>{setTimeout(()=>session(s),0)});const {data,error}=await db.auth.getSession();if(error)$('message').textContent=error.message;else await session(data.session);
</script></body></html>
