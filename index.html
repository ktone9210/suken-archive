<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学検定1級 過去問データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#243247;font:15px system-ui,sans-serif}header{background:#172b46;color:white;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #dce3ed;border-radius:10px;padding:24px;margin-bottom:18px}#login{max-width:440px;margin:40px auto}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #aab8c9;border-radius:6px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:11px 16px;background:#244e80;color:white}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}nav button{background:white;color:#244e80;border:1px solid #ccd6e2}nav button.active{background:#244e80;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#eef3f9;padding:18px;border-radius:8px}.stat strong{display:block;font-size:28px;margin-top:8px}.muted{color:#64748b}.error{color:#a12222;white-space:pre-wrap}li{padding:10px 0;border-bottom:1px solid #eee} [hidden]{display:none!important}@media(max-width:600px){main{padding:12px}header{padding:16px}h1{font-size:16px}section{padding:16px}}textarea{width:100%;padding:12px;border:1px solid #aab8c9;border-radius:6px;font:inherit}input[type=checkbox]{width:auto;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.secondary{background:#64748b}.danger{background:#a12222}.examrow{border-top:1px solid #dce3ed;padding:16px 0}.examrow p{white-space:pre-wrap;overflow-wrap:anywhere}.editor{background:#f4f6fa;padding:16px;border-radius:8px;margin:16px 0}</style></head><body><header><h1>数学検定1級 過去問データベース</h1><button id="logout" hidden>ログアウト</button></header><main><section id="login"><h2>ログイン</h2><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><p><button id="submit">ログイン</button></p></form><p id="message" class="error" role="alert"></p></section><div id="app" hidden><nav id="nav"></nav><section id="content"></section><p class="muted">基本版 v0.2 · 個人用</p></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dcbivrsuiidprqfowzef.supabase.co','sb_publishable_IPqzrAOb_YfN06QwEWmiRg_50J2IniE');
const owner='273e6753-3e0b-413d-8795-22f10388b255';const $=id=>document.getElementById(id);let current=null,seq=0;const tabs=['ホーム','検定回別','タグ別','復習履歴','データ管理'];
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}function add(tag,text,cls){$('content').append(el(tag,text,cls))}function fail(e){add('p',e.message||String(e),'error')}
async function show(tab){const token=++seq;const c=$('content');c.replaceChildren();for(const b of $('nav').children)b.classList.toggle('active',b.textContent===tab);add('h2',tab);try{if(tab==='ホーム'){const tables=['exams','questions','reviews'];const res=await Promise.all(tables.map(t=>db.from(t).select('id',{count:'exact',head:true})));if(token!==seq)return;for(const r of res)if(r.error)throw r.error;const grid=el('div','','stats');res.forEach((r,i)=>{const d=el('div',['検定回','登録問題','復習記録'][i],'stat');d.append(el('strong',String(r.count??0)));grid.append(d)});c.append(grid);add('p','検定回別から検定回を登録・編集できます。問題登録は未実装です。','muted')}else if(tab==='検定回別'){await exams(c,token)}else if(tab==='データ管理'){add('p','PDF・画像登録、タグ編集、バックアップは未実装です。','muted')}else{const t={'検定回別':'exams','タグ別':'tags','復習履歴':'reviews'}[tab];const {data,error}=await db.from(t).select('*').order(t==='exams'?'exam_number':t==='tags'?'name':'review_date',{ascending:t==='tags'});if(token!==seq)return;if(error)throw error;if(!data.length)add('p','まだ登録されていません。','muted');else{const list=el('ul','');for(const r of data)list.append(el('li',t==='exams'?`第${r.exam_number}回 (${r.exam_date})`:t==='tags'?r.name:`${r.review_date} · ${r.result} · ${r.memo??''}`));c.append(list)}}}catch(e){if(token===seq)fail(e)}}
async function exams(c,token){
 const button=(label,fn,cls)=>{const b=el('button',label,cls);b.type='button';b.onclick=fn;return b};
 const editor=el('div','','editor');editor.hidden=true;
 c.append(button('＋ 検定回を登録',()=>openEditor()),editor);
 function openEditor(r){editor.replaceChildren();editor.hidden=false;editor.append(el('h3',r?'検定回を編集':'検定回を登録'));const f=el('form','');editor.append(f);
 function field(label,type,value){const l=el('label',label);const n=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')n.type=type;if(type==='checkbox'){n.checked=!!value;l.prepend(n);f.append(l)}else{n.value=value??'';l.append(n);f.append(l)}return n}
 const num=field('検定回番号','number',r?.exam_number);num.required=true;num.min='1';num.max='2147483647';num.step='1';const date=field('実施日','date',r?.exam_date);date.required=true;const exempt=field('一次試験免除','checkbox',r?.first_stage_exempt??false);const draft=field('下書き','checkbox',r?.is_draft??true);const memo=field('備考','textarea',r?.memo);memo.rows=4;
 const actions=el('div','','actions');const save=el('button','保存');save.type='submit';actions.append(save,button('キャンセル',()=>{editor.hidden=true;editor.replaceChildren()},'secondary'));f.append(actions);const msg=el('p','','error');f.append(msg);
 f.onsubmit=async e=>{e.preventDefault();save.disabled=true;msg.textContent='';try{const payload={exam_number:Number(num.value),exam_date:date.value,first_stage_exempt:exempt.checked,is_draft:draft.checked,memo:memo.value.trim()||null};const q=r?db.from('exams').update(payload).eq('id',r.id):db.from('exams').insert(payload);const {error}=await q.select('id').single();if(error)throw error;if(token===seq)await show('検定回別')}catch(e){msg.textContent=e.message||String(e)}finally{save.disabled=false}};num.focus();editor.scrollIntoView({block:'nearest'});
 }
 const {data,error}=await db.from('exams').select('*').order('exam_number',{ascending:false});if(token!==seq)return;if(error)throw error;if(!data.length){add('p','まだ登録されていません。','muted');return}
 for(const r of data){const row=el('div','','examrow');row.append(el('h3',`第${r.exam_number}回　${r.exam_date}`),el('p',`${r.first_stage_exempt?'一次試験免除':'一次・二次試験'} ／ ${r.is_draft?'下書き':'登録済み'}`,'muted'));if(r.memo)row.append(el('p',r.memo));const a=el('div','','actions');const del=button('削除',async()=>{if(!confirm(`第${r.exam_number}回を削除しますか？ 関連データが削除される可能性があります。`))return;del.disabled=true;try{const {error}=await db.from('exams').delete().eq('id',r.id).select('id').single();if(error)throw error;if(token===seq)await show('検定回別')}catch(e){if(token===seq)fail(e)}finally{del.disabled=false}},'danger');a.append(button('編集',()=>openEditor(r)),del);row.append(a);c.append(row)}
}
for(const t of tabs){const b=el('button',t);b.onclick=()=>show(t);$('nav').append(b)}
async function session(s){if(s&&s.user.id!==owner){await db.auth.signOut();$('message').textContent='このアカウントは利用できません。';return}if(current===s?.user.id&&s)return;current=s?.user.id??null;$('login').hidden=!!s;$('app').hidden=!s;$('logout').hidden=!s;if(s){$('password').value='';$('message').textContent='';show('ホーム')}else{seq++;$('content').replaceChildren()}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await session(data.session)}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)fail(error);else await session(null)};db.auth.onAuthStateChange((event,s)=>{setTimeout(()=>session(s),0)});const {data,error}=await db.auth.getSession();if(error)$('message').textContent=error.message;else await session(data.session);
</script></body></html>
